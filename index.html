<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KCW — Khizar's Custom Wood Work. Premium custom cabinetry, millwork, and bespoke woodwork in the Greater Toronto Area.">
  <title>KCW — Khizar's Custom Wood Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">

  <!-- Splash overlay -->
  <div class="splash" id="splash">
    <div class="splash-logo">
      <img src="assets/kcwlogo.png" alt="KCW Logo" class="splash-logo-dark" id="logoDark">
    </div>
  </div>

  <!-- Animated border line -->
  <svg class="hero-border-frame" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">
    <rect class="hero-border-track" x="3" y="3" width="994" height="554"/>
    <rect class="hero-border-line"  x="3" y="3" width="994" height="554"/>
  </svg>

  <!-- Header injected by templates.js -->
  <div id="site-header" data-active="home"></div>

  <!-- Hero — fills viewport, no scroll -->
  <section class="hero" id="home">
    <div class="hero-bg">
      <video class="hero-bg-video" autoplay muted loop playsinline>
        <source src="assets/forest-bg.mp4" type="video/mp4">
      </video>
    </div>
    <div class="hero-center-logo">
      <img src="kcw white logo .png" alt="KCW Logo" class="hero-logo">
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
