<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact KCW — get a quote for your custom home, commercial fit-out, or renovation in the Greater Toronto Area. Call (647) 231-5177 or send a message.">
  <meta property="og:title" content="Contact KCW | Custom Home Builder Toronto — (647) 231-5177">
  <meta property="og:description" content="Tell us about your project — we'll come back with what it really takes to do it right. Custom homes, commercial fit-outs, and renovations across the GTA.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>Contact KCW | Custom Home Builder Toronto — (647) 231-5177</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>if(sessionStorage.getItem('pt-active')){document.documentElement.style.opacity='0';}</script>
</head>
<body data-page="contact">

  <div id="site-header" data-active="contact" data-scrolled="true"></div>

  <section id="contact" class="contact-section contact-section-v2 reveal">
    <div class="contact-bg" aria-hidden="true"></div>
    <div class="container">

      <header class="contact-header">
        <h2 class="contact-title">Start Your Project</h2>
      </header>

      <div class="contact-grid-v2">

        <aside class="contact-info-panel">
          <h3 class="contact-info-heading">Reach Us Directly</h3>

          <a href="tel:+16472315177" class="contact-info-row">
            <span class="contact-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72a2 2 0 0 1 1.72 2z"/>
              </svg>
            </span>
            <span class="contact-info-meta">
              <span class="contact-info-label">Phone</span>
              <span class="contact-info-value">(647) 231-5177</span>
            </span>
          </a>

          <a href="mailto:khizar@k-customwoodwork.ca" class="contact-info-row">
            <span class="contact-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <span class="contact-info-meta">
              <span class="contact-info-label">Email</span>
              <span class="contact-info-value">khizar@k-customwoodwork.ca</span>
            </span>
          </a>

          <div class="contact-info-row contact-info-row-static">
            <span class="contact-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
            </span>
            <span class="contact-info-meta">
              <span class="contact-info-label">Studio</span>
              <span class="contact-info-value">100 Dynamic Drive</span>
            </span>
          </div>

          <a href="https://www.instagram.com/k_customwoodwork/" target="_blank" rel="noopener" class="contact-info-row">
            <span class="contact-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
              </svg>
            </span>
            <span class="contact-info-meta">
              <span class="contact-info-label">Instagram</span>
              <span class="contact-info-value">@k_customwoodwork</span>
            </span>
          </a>
        </aside>

        <form class="contact-form-v2" id="contactForm" action="https://api.web3forms.com/submit" method="POST" novalidate>
          <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
          <input type="hidden" name="subject" value="New enquiry from KCW website">
          <input type="hidden" name="from_name" value="KCW Website Contact Form">
          <input type="checkbox" name="botcheck" style="display:none;" tabindex="-1" autocomplete="off">

          <div class="field">
            <input type="text" id="name" name="name" required placeholder=" ">
            <label for="name">Your Name</label>
          </div>

          <div class="field-row">
            <div class="field">
              <input type="email" id="email" name="email" required placeholder=" ">
              <label for="email">Email</label>
            </div>
            <div class="field">
              <input type="tel" id="phone" name="phone" placeholder=" ">
              <label for="phone">Phone</label>
            </div>
          </div>

          <div class="field">
            <select id="service" name="service" required>
              <option value="" disabled selected hidden></option>
              <option>Custom Home Build</option>
              <option>Commercial Fit-Out</option>
              <option>Renovation</option>
              <option>Addition / Second Storey</option>
              <option>Other</option>
            </select>
            <label for="service">Project Type</label>
          </div>

          <div class="field">
            <textarea id="message" name="message" rows="5" required placeholder=" "></textarea>
            <label for="message">Tell us about your project</label>
          </div>

          <button type="submit" class="contact-submit" id="submitBtn">
            <span class="contact-submit-label">Send Message</span>
            <span class="contact-submit-arrow" aria-hidden="true">→</span>
          </button>
        </form>

      </div>
    </div>
  </section>

  <div id="site-footer" data-variant="full"></div>

  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
